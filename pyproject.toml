[project]
name = "demo-tools"
version = "0.1.0"
description = "CLI + Copier template for spinning up and deploying demo web apps to Fly.io"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bosire Nyakundi" }]
dependencies = [
    "typer>=0.12",
    # _reflect.py imports click directly (isinstance/type introspection). Typer
    # >=0.26 no longer pulls click transitively, so declare it explicitly.
    "click>=8",
    "copier>=9.4",
    "rich>=13.7",
]

[project.scripts]
demo-init = "demo_tools.cli:init_app"
demo = "demo_tools.cli:demo_app"
demo-mcp = "demo_tools.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_tools"]

[tool.hatch.build]
include = [
    "src/demo_tools/**",
]

# The Copier template and shipped starters live under src/demo_tools/_data and
# are picked up by the `include` above, which maps through `packages`. They used
# to ALSO be force-included, which made `uv tool install`/`uvx` from a git URL
# fail outright: "A second file is being added to the wheel archive at the same
# path: demo_tools/_data/starters/fastapi/main.py". Nothing installed from git
# until this came out.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    # Exercise the fastapi starter's ROOT_PATH routing (local-target base path).
    "fastapi>=0.115",
    "httpx>=0.27",
]
