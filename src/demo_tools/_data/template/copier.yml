_min_copier_version: "9.4.0"
_subdirectory: "."
_answers_file: ".demo-template-version"

# These are answered programmatically by the CLI; users never see prompts.
name:
  type: str
  help: "Demo / Fly app name (kebab-case)"

stack:
  type: str
  help: "Which stack: nextjs | nextjs-fastapi | fastapi | streamlit | vite | html | bare"
  choices:
    - nextjs
    - nextjs-fastapi
    - fastapi
    - streamlit
    - vite
    - html
    - bare

stateful:
  type: bool
  help: "Does this stack need SQLite + a Fly volume?"
  default: false

internal_port:
  type: int
  help: "Port the container exposes (3000 for nextjs, 8000 for fastapi, etc.)"
  default: 3000

host_port:
  type: int
  help: "Host port published on the local target (defaults to internal_port; set it when another app already owns that port)"
  default: "{{ internal_port }}"

domain_base:
  type: str
  help: "Subdomain base (results in <name>.<domain_base>)"
  default: "demos.buildwithbos.com"

profile:
  type: str
  help: "demo (auto-stop, 0 min machines) | service (always-on, ≥1 machine)"
  choices:
    - demo
    - service
  default: demo

target:
  type: str
  help: "Deploy target: fly (cloud) | local (Tailscale container) | pages (GitHub Pages)"
  choices:
    - fly
    - local
    - pages
  default: fly            # backward-compatible: existing behaviour unchanged

# Derived by the CLI from the stack (see demo_tools/targets.py) so the template
# never has to duplicate the compatibility rules.
dockerised:
  type: bool
  help: "Does this stack build a Docker image? (false for html)"
  default: true

pages_ok:
  type: bool
  help: "Can this stack be served as static files by GitHub Pages?"
  default: false

publish_mode:
  type: str
  help: "How pages publishes: root (Pages serves main) | branch (build output pushed to gh-pages)"
  choices:
    - root
    - branch
  default: branch

tailscale_host:
  type: str
  help: "MagicDNS name of the machine that runs the container + Tailscale"
  default: "bos-desktop.fish-grouper.ts.net"
  when: "{{ target == 'local' }}"

tailscale_path:
  type: str
  help: "URL path prefix under the shared Tailscale host (Tailscale strips it before proxying; the app is served here)"
  default: "/{{ name }}"
  when: "{{ target == 'local' }}"

# Files Copier should not copy into rendered demos.
# IMPORTANT: this list REPLACES Copier's built-in default exclude list (it does
# not extend it), so we must include the defaults too — otherwise copier.yml
# itself leaks into every rendered demo.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[cod]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"

# Post-render cleanup. For nextjs-fastapi, the real Dockerfile/fly.toml live in
# web/ and api/ (created by the scaffolder); the top-level renderings are
# fail-fast placeholders that should be removed. compose.yml is KEPT — its
# dual-app branch in compose.yml.jinja wires both services for `just build`/
# `just dev` at the top level.
_tasks:
  - "{% if stack == 'nextjs-fastapi' %}rm -f Dockerfile fly.toml{% endif %}"
  # Only ship infra a stack can actually use. A directory of scripts that can
  # never run is worse than no directory: it reads as a supported path.
  - "{% if not pages_ok %}rm -rf infra/pages{% endif %}"
  # Only the stacks whose Dockerfile this template owns can get a dev overlay
  # that actually runs (nextjs ships a standalone runner, vite ships nginx —
  # neither production image can host a dev server, and `bare` has no Dockerfile
  # at all). The others fall back to the production image and say so, which
  # beats shipping an overlay that fails on first use.
  - "{% if stack not in ['fastapi', 'streamlit'] %}rm -f compose.dev.yml{% endif %}"
  - "{% if not dockerised %}rm -rf infra/fly infra/local fly.toml Dockerfile .dockerignore compose.yml compose.local.yml .github{% endif %}"
